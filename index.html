<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>American English Pronunciation Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --active-bg: #eff6ff;
            --active-border: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Tajawal', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-sub);
            font-size: 1rem;
        }

        .controls-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .settings-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .setting-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-sub);
            font-size: 0.9rem;
            font-weight: 500;
        }

        select, input[type="range"] {
            font-family: inherit;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            outline: none;
            background: var(--bg);
            color: var(--text-main);
            font-weight: 500;
        }

        .word-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .word-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 16px 24px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .word-card:hover {
            border-color: var(--active-border);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
        }

        .word-card.active {
            background-color: var(--active-bg);
            border-color: var(--active-border);
        }

        .left-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            transition: all 0.2s;
        }

        .word-card:hover .icon-btn, .word-card.active .icon-btn {
            background: var(--primary);
            color: white;
        }

        .en-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .ar-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-sub);
            direction: rtl;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>American English Pronunciation</h1>
        <p>Listen with natural US accent and customizable speech speed</p>
    </header>

    <div class="controls-card">
        <div class="btn-group">
            <button id="playAllBtn" class="btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                Play All
            </button>
            <button id="stopBtn" class="btn-danger">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>
                Stop
            </button>
        </div>

        <div class="settings-group">
            <div class="setting-item">
                <label for="voiceSelect">Voice:</label>
                <select id="voiceSelect"></select>
            </div>
            <div class="setting-item">
                <label for="speedRange">Speed:</label>
                <input type="range" id="speedRange" min="0.6" max="1.1" step="0.05" value="0.85">
                <span id="speedVal">0.85x</span>
            </div>
        </div>
    </div>

    <div class="word-list" id="wordList"></div>
</div>

<script>
    const words = [
        ["American", "أمريكي"],
        ["Landscape", "منظر طبيعي"],
        ["Mirror", "مرآة"],
        ["Panic", "ذعر"],
        ["Adjust", "يتكيف"],
        ["Challenges", "تحديات"],
        ["Curious", "فضولي"],
        ["Portrait", "صورة شخصية"],
        ["Ashamed", "خجل"],
        ["Outgoing", "اجتماعي"],
        ["Strong", "قوي"],
        ["Blazer", "سترة"],
        ["Blend", "يمزج"],
        ["Comfort", "راحة"],
        ["Beauty", "جمال"],
        ["Perfect", "مثالي"],
        ["Talent", "موهبة"],
        ["Introduce", "يقدّم"],
        ["Assignment", "واجب"],
        ["Hand-drawn", "مرسوم باليد"],
        ["Click", "نقرة"],
        ["Thumbs-up", "إعجاب"],
        ["Creative", "مبدع"],
        ["Sketches", "رسومات تخطيطية"],
        ["Confident", "واثق"],
        ["Values", "قيم"],
        ["Adjusting", "يتكيف"],
        ["Give assignment", "يعطي واجباً"],
        ["Give thumbs-up", "يعطي إعجاباً"],
        ["Feel unsure", "يشعر بعدم اليقين"],
        ["Find comfort", "يجد الراحة"],
        ["Have a look", "يلقي نظرة"],
        ["Stand before", "يقف أمام"],
        ["Ideal", "مثالي"],
        ["Imperfect", "غير كامل"],
        ["Quiet", "هادئ"],
        ["Peaceful", "مسالم"],
        ["Calm", "هادئ"],
        ["Noisy", "صاخب"],
        ["Loud", "عالي الصوت"],
        ["Sociable", "اجتماعي"],
        ["Extrovert", "منفتح"],
        ["Shy", "خجول"],
        ["Introvert", "انطوائي"],
        ["Relief", "ارتياح"],
        ["Ease", "سهولة"],
        ["Discomfort", "عدم راحة"],
        ["Interested", "مهتم"],
        ["Uninterested", "غير مهتم"],
        ["Colorful", "ملوّن"],
        ["Bright", "مشرق"],
        ["Plain", "بسيط"],
        ["Sure", "متأكد"],
        ["Certain", "متيقن"],
        ["Unsure", "غير متأكد"],
        ["Adapt", "يتأقلم"],
        ["Resist", "يقاوم"]
    ];

    const listEl = document.getElementById("wordList");
    const voiceSelect = document.getElementById("voiceSelect");
    const speedRange = document.getElementById("speedRange");
    const speedVal = document.getElementById("speedVal");

    let voices = [];
    let currentIndex = -1;
    let playingAll = false;

    function populateVoices() {
        voices = window.speechSynthesis.getVoices().filter(v => v.lang === 'en-US' || v.lang === 'en_US');
        
        if (voices.length === 0) {
            voices = window.speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
        }

        voiceSelect.innerHTML = '';
        
        // Prioritize Natural / High Quality American Voices
        voices.sort((a, b) => {
            const aName = a.name.toLowerCase();
            const bName = b.name.toLowerCase();
            if (aName.includes('natural') || aName.includes('google') || aName.includes('samantha')) return -1;
            return 1;
        });

        voices.forEach((voice, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = `${voice.name} (US)`;
            voiceSelect.appendChild(option);
        });
    }

    populateVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoices;
    }

    speedRange.addEventListener('input', (e) => {
        speedVal.textContent = e.target.value + 'x';
    });

    words.forEach(([en, ar], i) => {
        const item = document.createElement("div");
        item.className = "word-card";
        item.id = "word-" + i;
        item.innerHTML = `
            <div class="left-content">
                <div class="icon-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                    </svg>
                </div>
                <span class="en-text">${en}</span>
            </div>
            <span class="ar-text">${ar}</span>
        `;
        item.addEventListener("click", () => {
            playingAll = false;
            speakWord(i);
        });
        listEl.appendChild(item);
    });

    function clearActive() {
        document.querySelectorAll(".word-card").forEach(el => el.classList.remove("active"));
    }

    function speakWord(i) {
        window.speechSynthesis.cancel();
        clearActive();

        const el = document.getElementById("word-" + i);
        el.classList.add("active");
        el.scrollIntoView({ behavior: "smooth", block: "center" });

        const utter = new SpeechSynthesisUtterance(words[i][0]);
        
        if (voices.length > 0) {
            const selectedVoiceIndex = voiceSelect.value || 0;
            utter.voice = voices[selectedVoiceIndex];
        }

        utter.lang = "en-US";
        utter.rate = parseFloat(speedRange.value);
        utter.pitch = 1.0; 

        currentIndex = i;
        utter.onend = () => {
            if (playingAll && currentIndex < words.length - 1) {
                setTimeout(() => speakWord(currentIndex + 1), 300);
            } else if (playingAll) {
                playingAll = false;
                clearActive();
            }
        };

        window.speechSynthesis.speak(utter);
    }

    document.getElementById("playAllBtn").addEventListener("click", () => {
        playingAll = true;
        speakWord(0);
    });

    document.getElementById("stopBtn").addEventListener("click", () => {
        playingAll = false;
        window.speechSynthesis.cancel();
        clearActive();
    });
</script>

</body>
</html>
